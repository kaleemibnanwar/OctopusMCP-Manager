[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "octopusmcp"
version = "0.1.0"
description = "Local-first manager for isolated MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "mcp>=1.9,<2",
  "packaging>=24,<27",
  "platformdirs>=4.3,<5",
  "psutil>=6,<8",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.12,<7", "pytest>=8.3,<9", "pytest-cov>=6,<7"]

[project.scripts]
octopusmcp = "octopusmcp.cli:app"
octopusmcp-bridge = "octopusmcp.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/octopusmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
