name: Windows Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python virtual environment
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer
        run: npm run make

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: soloman-manager-windows
          path: out/make/squirrel.windows/x64/*Setup.exe
          if-no-files-found: error

      - name: Publish installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem out/make/squirrel.windows/x64/*Setup.exe | Select-Object -First 1
          gh release view windows-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --prerelease --title "Soloman Manager - Windows build" --notes "Automated Windows installer built from main."
          }
          gh release upload windows-latest $exe.FullName --clobber
